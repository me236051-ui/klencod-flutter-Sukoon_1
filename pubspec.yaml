name: sukoon
description: "تطبيق سكون - أذكار، قرآن كريم، مواقيت الصلاة، مسبحة ومهام"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # مكتبة تنسيق التواريخ والأوقات
  intl: ^0.19.0

  # لتشغيل القرآن الكريم والتلاوات الصوتية في الخلفية
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # لحساب مواقيت الصلاة والموقع
  adhan: ^2.0.0
  geolocator: ^10.1.0

  # للإشعارات والاهتزاز في المسبحة (تم التحديث هنا)
  flutter_local_notifications: ^17.0.0
  vibration: ^3.1.1

  # لتخزين المهام والأذكار محلياً على الجهاز
  shared_preferences: ^2.2.2

  # لأيقونات الواجهات والتصميم
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  